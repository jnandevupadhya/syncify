<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Set track_progress to be a module -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&family=Rubik+Moonrocks&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:wght@100..900&family=Gowun+Dodum&family=Rubik+Moonrocks&display=swap"

    <meta charset="UTF-8" />

    <link href="styles.css" rel="stylesheet" />
  </head>
  <body style="position: relative">
    <div id="main-container">
      <!-- Spotify now-playing placeholder -->
      <div class="spotify-now-playing">
        <div class="main">
          <img class="cover" src="1wp.jpg" alt="Album cover" />
          <div class="meta">
            <div class="title">Woops, nothing here!</div>
            <div class="artists">Unknown Artist</div>
          </div>
          <div class="controls">
            <svg
              class="play-btn"
              viewBox="0 0 16 16"
              style="width: 16px; height: 16px; cursor: pointer"
            >
              <path
                d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288z"
              ></path>
            </svg>
            <svg
              class="pause-btn"
              data-encore-id="icon"
              role="img"
              aria-hidden="true"
              viewBox="0 0 16 16"
              style="
                --encore-icon-height: 16px;
                --encore-icon-width: 16px;
                cursor: pointer;
              "
            >
              <path
                d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"
              ></path>
            </svg>
            <svg
              class="btn next-btn"
              data-encore-id="icon"
              role="img"
              aria-hidden="true"
              viewBox="0 0 16 16"
              style="--encore-icon-height: 16px; --encore-icon-width: 16px"
            >
              <path
                d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"
              ></path>
            </svg>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-time-wrapper">
            <div class="progress-time">0:00</div>
            <div class="progress-duration">0:00</div>
          </div>
          <div class="progress-bar">
            <div class="progress"></div>
            <div class="thumb"></div>
          </div>
        </div>
      </div>

      <!-- Stopped sync overlay -->
      <div id="stopped-sync-overlay">
        <div class="overlay-text">S t o p p e d‎ ‎ ‎ ‎ ‎ s y n c i n g</div>
      </div>
      <div id="slow-conn">
        <div id="slow-conn-overlay-text">Slow connection, reconnecting T_T</div>
      </div>
      <div id="loader-overlay">
        <img src="loader.gif" alt="Loading..." class="loader-gif" />
      </div>

      <div id="general-overlay">
        <div id="general-text"></div>
      </div>

      <div id="input-overlay">
        <div class="crafty group">
          <input type="text" id="name" required="required" />
          <label for="name">Name</label>
          <div class="bar"></div>
        </div>
        <div class="crafty group">
          <div class="input-wrapper">
            <input type="text" id="room-id" required />
            <label for="room-id">Room ID</label>
            <button
              id="join-btn"
              type="button"
              class="crafty font-extralight btn btn--primary btn--inside uppercase"
            >
              JOIN
            </button>
            <div class="bar" style="height: 3px"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="room-btns">
      <button id="start-sync" title="Toggle start/stop syncing with the host">
        Start Sync
      </button>
